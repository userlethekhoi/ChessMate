name: Release & Auto Update Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Run Test Suite
        run: npm test

      - name: Build Extension (Vite)
        run: npm run build

      - name: Package Extension ZIP
        run: |
          cd dist
          zip -r ../chessmate-agent.zip ./*
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: chessmate-agent.zip
          name: Release ${{ github.ref_name }}
          body_path: version.json
          generate_release_notes: true
          draft: false
          prerelease: false
